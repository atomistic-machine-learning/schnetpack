# spksample's defaults. spksample merges them under the run's config.yaml (a
# `sample:` block in the run's experiment config wins over them) and the command
# line's key=value overrides over both, so ${generative.*} and ${seed} are the run's.
sample:
  n_samples: 1000
  n_steps: [100]  # one sample set per entry
  batch_size: 1000  # molecules per model call
  seed: ${oc.select:seed,null}  # the run's training seed
  compile: false
  out_dir: ${run.path}/${run.id}/samples
  # one update per variable of the run's generative: block, by its key; the
  # variables are drawn from their priors in this order
  updates:
    positions:
      _target_: schnetpack.dynamics.AncestralUpdate
      _partial_: true
  grid:
    _target_: schnetpack.dynamics.KarrasGrid
    t_min: 1e-3
    rho: 7.0
  # on every batch of compositions (test split); all pairs suit models whose
  # cutoff spans the molecule
  structure_transforms:
    - _target_: schnetpack.transform.AllToAllNeighborList
    - _target_: schnetpack.transform.CastTo32
