# spk evaluate dbs=<ASE db or pattern, or a list of them>: metrics of generated
# structures into eval.json next to each db. Quote patterns:
#   spk evaluate 'dbs=runs/gpff/samples/*.db'
# Molecules: validity and uniqueness (RDKit). Crystals (a periodic cell): validity,
# uniqueness, novelty against `known`; with a `calculator` they are relaxed first, and
# with a `hull` their stability is added.
defaults:
  - override hydra/job_logging: stdout
  - _self_

dbs: ???  # ASE dbs of generated structures (spk sample's), patterns allowed
timeout: 5  # seconds per molecule

# crystals
known: null  # ASE db of known crystals, for the novelty
split: null  # a run's split file: only the train and val rows of `known` count
# a ForceCalculator with a stress_key, as a Hydra target: its model relaxes the
# crystals, cell and positions, batch_size at a time (LBFGS with relax_cell). A model
# folder is loaded in float64:
#   'calculator={_target_: schnetpack.dynamics.ForceCalculator, model: <model folder>, stress_key: stress, device: cuda, neighbor_list: {_target_: schnetpack.dynamics.BatchNeighborList, neighbor_list: {_target_: schnetpack.transform.MatScipyNeighborList, cutoff: 6.0}}}'
calculator: null
batch_size: 256  # crystals relaxed together
fmax: 0.05  # eV/A: a crystal is relaxed when its largest force, cell included, is below
steps: 500  # the step limit of a batch
hull: null  # ASE db of reference phases; energies from the calculator's level of theory
hull_energy: energy  # the name of the total energy (eV) in the hull db
stable_below: 0.1  # eV per atom above the hull

hydra:
  output_subdir: null
  run:
    dir: .
