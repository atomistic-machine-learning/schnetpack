# @package data
defaults:
  - custom

dataset:
  _target_: schnetpack.datasets.qm9.QM9
  datapath: ${run.data_dir}/qm9.db
  remove_uncharacterized: true
  load_properties: null
  distance_unit: Ang
  property_units:
    energy_U0: eV
    energy_U: eV
    enthalpy_H: eV
    free_energy: eV
    homo: eV
    lumo: eV
    gap: eV
    zpve: eV

batch_size: 100
num_train: 110000
num_val: 10000
# null: use all remaining molecules (10831) as the test set
num_test: null
# with 2 workers the GPU waited for data: a PaiNN 3 x 128 training step took 55 ms on
# an H100 PCIe, against 26 ms with 8
num_workers: 8
