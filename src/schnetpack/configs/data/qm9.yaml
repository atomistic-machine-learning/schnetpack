# @package data
defaults:
  - custom

dataset:
  _target_: schnetpack.datasets.qm9.QM9
  datapath: ${run.data_dir}/qm9.db
  remove_uncharacterized: true
  load_properties: null
  distance_unit: Ang
  property_units:
    energy_U0: eV
    energy_U: eV
    enthalpy_H: eV
    free_energy: eV
    homo: eV
    lumo: eV
    gap: eV
    zpve: eV
  transforms: ${data.transforms}

batch_size: 100
num_train: 110000
num_val: 10000
num_test: 10000
num_workers: 2
