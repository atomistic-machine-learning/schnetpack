# @package data
_target_: schnetpack.lightning.AtomsDataModule

dataset:
  _target_: schnetpack.data.ASEAtomsData
  datapath: ???
  load_properties: null
  # null: keep the dataset's native units — setting a unit here converts on
  # load.
  distance_unit: null
  property_units: null
  transforms: null
  train_transforms: null
  val_transforms: null
  test_transforms: null

batch_size: 10
num_train: ???
num_val: ???
num_test: null
split_file: ${run.path}/${run.id}/split.npz
splitting: null
num_workers: 8
train_sampler_cls: null
train_sampler_args: {}
pin_memory: false
# transforms of every collated batch (offsets, casts, noise), on the trainer's
# device; dataset.transforms act on one structure
batch_transforms: null
# speed: read every structure once into a cache (kept in cache_dir) and slice
# padded batches from it; dataset.transforms must then be deterministic and need
# no statistics (see the user guide, "Training faster")
cache: false
cache_dir: null
# with a cache: drop the last training batch of each pass, also a full one
drop_last: true
