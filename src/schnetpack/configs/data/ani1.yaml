# @package data
defaults:
  - custom

dataset:
  _target_: schnetpack.datasets.ANI1
  datapath: ${run.data_dir}/ani1.db # data_dir is specified in train.yaml
  num_heavy_atoms: 8
  high_energies: false
  distance_unit: Ang
  property_units:
    energy: eV
  transforms: ${data.transforms}


batch_size: 32
num_train: 10000000
num_val: 100000
