# @package data
defaults:
  - custom

fold: reference

dataset:
  _target_: schnetpack.datasets.ISO17
  # ISO17 takes the data root directory and stores the databases under
  # <datapath>/iso17/<fold>.db itself.
  datapath: ${run.data_dir}
  fold: ${data.fold}

batch_size: 32
num_train: 0.9
num_val: 0.1
