# spk predict model_dir=<model folder or run folder> db=<ASE db> out=<folder>: runs the
# model on every structure of the db and writes the predictions to out.
defaults:
  - trainer: default_trainer
  - _self_
  - override hydra/job_logging: stdout

model_dir: ???  # a model folder, or a run folder of spk train
db: ???  # the ASE db of structures
out: ???  # the folder the predictions are written to
ckpt_path: null  # a training checkpoint whose weights replace the model's
batch_size: 100
write_interval: epoch
enable_grad: false
compile: false
write_idx_m: false

hydra:
  output_subdir: null
  run:
    dir: .
