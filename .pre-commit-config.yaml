# This file is the single source of truth for linter/formatter versions.
ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  skip: [jupytext-sync]

repos:
  # The tutorials and how-tos are tracked as jupytext .py files; the paired .ipynb is
  # gitignored (see examples/jupytext.toml). This hook makes sure that jupytext .py files
  # are synced with locally modified notebooks.
  - repo: local
    hooks:
      - id: jupytext-sync
        name: jupytext sync
        entry: >-
          bash -c 'find examples/howtos examples/tutorials_deprecated -name "*.ipynb"
          -not -path "*/.ipynb_checkpoints/*" -print0 | xargs -0 -r -n1 jupytext --sync'
        language: python
        additional_dependencies: ["jupytext==1.19.5"]
        # the .ipynb is gitignored, so pre-commit never sees it staged
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # hydra configs use `???` for mandatory-missing values and `_self_` in
        # defaults lists; keep the checker away from that tree.
        exclude: ^src/schnetpack/(configs|md/md_configs)/
      - id: check-added-large-files
      - id: check-merge-conflict
