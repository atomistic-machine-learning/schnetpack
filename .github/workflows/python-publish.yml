# Publishes to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI Trusted Publishing (OIDC), not a long-lived API
# token. Build and publish are separate jobs so the job holding the OIDC
# credential never executes arbitrary build code.
#
# One-time setup on PyPI (project -> Publishing -> add a GitHub publisher):
#   repository: atomistic-machine-learning/schnetpack
#   workflow:   python-publish.yml
#   environment: pypi
# Once that is configured and a release has published successfully, the
# PYPI_API_TOKEN repository secret can be deleted.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
