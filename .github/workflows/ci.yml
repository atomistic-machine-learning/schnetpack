name: CI

on:
  # Only the default branch on push: without this, every PR from a same-repo
  # branch runs the whole workflow twice (once for push, once for pull_request).
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday 04:00 UTC - exercises the `slow`/`download` tests. The default
    # pytest selection (addopts in pyproject.toml) leaves them out, so this
    # schedule (and the `slow` job) is what covers them in CI.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # .pre-commit-config.yaml is the single source of truth for tool versions.
      - uses: pre-commit/action@v3.0.1

  test:
    strategy:
      # Report every interpreter: a 3.13-only break should not hide the 3.12 result.
      fail-fast: false
      matrix:
        # 3.12 is the floor declared by requires-python. 3.14 is left out because
        # matscipy ships no cp314 wheel and would have to build from sdist.
        python: ["3.12", "3.13"]
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[test] pytest-cov
      - run: pip list
      - run: pytest --cov=schnetpack --cov-report=term-missing

  slow:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[test]
      - run: pytest -m "slow or download"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build
      - run: pipx run twine check --strict dist/*
      - name: Assert the wheel ships every hydra config and py.typed
        # Guards the packaging bug where md_configs/**/*.yaml was absent from
        # every build, leaving `spkmd` broken in wheel/sdist installs.
        run: |
          python - <<'EOF'
          import glob, zipfile
          (whl,) = glob.glob("dist/*.whl")
          names = set(zipfile.ZipFile(whl).namelist())
          src = {
              p.removeprefix("src/")
              for p in glob.glob("src/schnetpack/**/*.yaml", recursive=True)
          }
          missing = sorted(src - names)
          print(f"{len(src)} yaml files in src, {len(missing)} missing from wheel")
          assert not missing, "yaml missing from wheel:\n" + "\n".join(missing)
          assert "schnetpack/py.typed" in names, "py.typed missing from wheel"
          EOF
      - name: Smoke-test console entry points from the installed wheel
        # CPU-only torch: the default PyPI torch pulls ~3 GB of CUDA wheels,
        # which exhausts the runner's disk and is not needed for `--help`.
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/v/bin/pip install --no-cache-dir dist/*.whl
          for c in spkconvert spkdeploy spktrain spkpredict spkmd; do
            echo "--- $c ---"
            /tmp/v/bin/$c --help > /dev/null
          done

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: pandoc/actions/setup@v1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[doc]"
      - if: github.event_name == 'schedule'
        run: pip install -e ".[mace]"
      # Pull requests (and Read the Docs) only render the notebooks. The Monday
      # schedule executes them, so that an example broken by an API change or a
      # dependency release fails here. Notebooks with an `nbsphinx: execute:
      # never` header (the deprecated tutorials) are skipped either way.
      - name: Build docs
        env:
          EXECUTE: ${{ github.event_name == 'schedule' && 'auto' || 'never' }}
        run: |
          sphinx-build -b html -W --keep-going \
            -D nbsphinx_execute=$EXECUTE docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
