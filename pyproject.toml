[build-system]
requires = ["setuptools>=70.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schnetpack"
# Version is specified in schnetpack.__version__
# see [tool.setuptools.dynamic] below
dynamic = ["version"]
authors = [
    { name = "Kristof T. Schuett" },
    { name = "Michael Gastegger" },
    { name = "Stefaan Hessmann" },
    { name = "Niklas Gebauer" },
    { name = "Jonas Lederer" }
]
description = "SchNetPack - Deep Neural Networks for Atomistic Systems"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "sympy>=1.13",
    "ase>=3.23",
    "h5py",
    "pyyaml",
    "hydra-core>=1.3,<2",
    "torch>=2.5.0",
    "pytorch_lightning>=2.2,<3",
    "torchmetrics",
    "hydra-colorlog>=1.1.0",
    "rich",
    "fasteners",
    "dirsync",
    "torch-ema",
    "matscipy>=1.1.0",
    "tensorboard>=2.17.1",
    "tensorboardX>=2.6.2.2",
    "tqdm",
    "petname",
    "vesin",
]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-datadir", "pytest-benchmark"]
dev = ["pre-commit"]
doc = [
    "ipykernel",
    # The tutorials are jupytext py:percent files; nbsphinx reads them through
    # jupytext (see nbsphinx_custom_formats in docs/conf.py), so the docs build
    # cannot parse them without it.
    "jupytext",
    "nbsphinx",
    "sphinx",
    "sphinx_rtd_theme",
]
# exporting MACE models with torch.export and building MACE models to train
# from scratch (schnetpack.interfaces.mace_interface); the archives load without
mace = ["mace-torch>=0.3.16,<0.4"]
# every extra above
all = ["schnetpack[test,dev,doc,mace]"]

[project.urls]
Repository = "https://github.com/atomistic-machine-learning/schnetpack"
Documentation = "https://schnetpack.readthedocs.io"

[project.scripts]
spktrain = "schnetpack.cli:train"
spkpredict = "schnetpack.cli:predict"
spkmd = "schnetpack.md.cli:simulate"
spkconvert = "schnetpack.cli:convert"
spkdeploy = "schnetpack.cli_scripts.deploy:main"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/_build", "src/schnetpack.egg-info", "docs_new/**/*.md"]

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E4", # pycodestyle: import placement
    "E7", # pycodestyle: statement/comparison bugs
    "E9", # pycodestyle: syntax and IO errors
    "W",  # pycodestyle warnings, incl. W605 invalid escape sequence
    "I",  # isort
    "B",  # flake8-bugbear
    "RUF013", # implicit Optional
    "NPY",    # numpy legacy/removed API
    "UP", # update type hints
]
ignore = [
    # ~876 hits, almost all docstrings and comments that the formatter will not
    # reflow. Code width is enforced by `ruff format`, not by a lint rule.
    "E501",
    # zip() without strict=: noisy, and not a bug in this codebase's usage.
    "B905",
    # legacy np.random.* is deliberate in test fixtures and tutorials, where a
    # seeded global RNG is the point. Not a correctness issue.
    "NPY002",
    "E741", # harmonic degree (angular momentum), and kept as `l`
]

[tool.ruff.lint.per-file-ignores]
# Every star-import in the package is in an __init__.py, and those re-exports
# ARE the public API surface: schnetpack.SchNet et al. resolve through them, and
# mypy honours them even under --no-implicit-reexport because each source module
# declares __all__.
"__init__.py" = ["F401", "F403", "F405", "E402"]
# tests/data/test_transforms.py deliberately star-imports schnetpack.transform
# to exercise the public surface the same way a user would.
"tests/**" = ["F841", "F403", "F405"]
# The tutorials are teaching material: `for step in tqdm(...)` reads better than
# `for _step in ...` even when the variable is unused, and imports belong in the
# notebook cell that first needs them (E402).
"examples/**" = ["B007", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["schnetpack"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Umbrella for strict_config + strict_markers + strict_xfail +
# strict_parametrization_ids (pytest >= 9). Set as an ini option, NOT as
# `--strict-markers` in addopts: those flags are OverrideIniAction, which only
# fires when passed on the command line, so from addopts they are silently
# inert and an unregistered marker stays a mere warning.
strict = true
markers = [
    "benchmark_sweep: batch-size scaling benchmarks; run with -m benchmark_sweep",
    "slow: takes more than a few seconds; run with -m slow",
    "download: needs network access to fetch a dataset; run with -m download",
]
# The default selection for `pytest`, locally and in CI. Any `-m` on the command
# line replaces this expression instead of narrowing it, so `-m slow` runs only
# the slow tests and `-m ""` runs everything.
addopts = "-m 'not benchmark_sweep and not slow and not download'"
filterwarnings = [
    "error::SyntaxWarning",
    # ase resizes arrays by assigning to .shape, deprecated since NumPy 2.5
    'ignore:Setting the shape on a NumPy array:DeprecationWarning:ase\.',
    # Lightning's advice on hardware and loader workers does not apply to tests
    "ignore:GPU available but not used",
    "ignore:The '.*' does not have many workers",
    # tests call the task's steps directly, without a trainer to log to
    'ignore:You are trying to .self\.log\(\). but the .self\.trainer. reference is not registered',
    # the model stays in the hparams: load_from_checkpoint rebuilds the task from it
    'ignore:Attribute .model. is an instance of .nn\.Module.',
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "schnetpack.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"schnetpack" = ["configs/**/*.yaml"]
"schnetpack.md" = ["md_configs/**/*.yaml"]
