# @package _global_
#
# PaiNN on rMD17 aspirin, energies and forces: the SchNetPack 2.0 paper's run
# (J. Chem. Phys. 2023, Table V). The command from its LaTeX source:
#
#   spktrain experiment=md17 data=rmd17 data.molecule=aspirin
#       model/representation=painn model.representation.n_atom_basis=128
#       globals.lr=1e-3 task.optimizer_args.weight_decay=0.01
#
# The library's rmd17 is that experiment on rMD17: 950 / 50 structures from the
# published split 0 (the paper's split, SchNetPack 2.0's data/rmd17.yaml) and its test
# structures, batch 10, 5 A cutoff, loss weights 0.01 (energy) and 0.99 (forces),
# kcal/mol and A, the mean energy removed; PaiNN 3 x 128 with 20 Gaussians; AdamW,
# lr halved after 75 epochs without improvement, EMA 0.995, early stopping after 200.
#
# Our choices: seed 999, the fast route (data.cache, a compiled model run as one CUDA
# graph, fused AdamW), and data.drop_last false: 950 / 10 gives 95 full batches, of
# which the default would drop the last in every epoch.
#
#   spktrain --config-dir=benchmarks/configs experiment=painn_rmd17_aspirin
#       run.data_dir=<folder with rmd17_aspirin.db>

defaults:
  - rmd17
  - override /model/representation: painn

seed: 999

globals:
  lr: 1e-3

data:
  molecule: aspirin
  splitting:
    split_id: 0
  cache: true
  drop_last: false

task:
  compile: true
  cuda_graph: true
  optimizer_args:
    weight_decay: 0.01
    fused: true
