# @package _global_
#
# PaiNN on QM9 U0: the SchNetPack 2.0 paper's run (J. Chem. Phys. 2023, Table V). The
# command from its LaTeX source:
#
#   spktrain experiment=qm9_atomwise globals.property=energy_U0
#       model/representation=painn model/representation/radial_basis=bessel
#       task.scheduler_args.patience=25 task.optimizer_args.weight_decay=0.01
#       trainer.max_epochs=5000 globals.lr=5e-4
#
# The rest comes from the library's qm9_atomwise: QM9 without the uncharacterized
# molecules, 110,000 / 10,000 molecules (the rest is the test set), batch 100, 5 A
# cutoff, atom references and the mean removed, sum over atoms, MSE loss; PaiNN
# 3 x 128 with 20 Bessel functions; AdamW, EMA 0.995, early stopping after 200 epochs.
#
# Our choices: seed 999 and the fast route (data.cache, a compiled model run as one
# CUDA graph, fused AdamW).
#
#   spktrain --config-dir=benchmarks/configs experiment=painn_qm9_U0
#       run.data_dir=<folder with qm9.db>

defaults:
  - qm9_atomwise
  - override /model/representation: painn
  - override /model/representation/radial_basis: bessel

seed: 999

globals:
  lr: 5e-4
  property: energy_U0

data:
  cache: true

task:
  compile: true
  cuda_graph: true
  optimizer_args:
    weight_decay: 0.01
    fused: true
  scheduler_args:
    patience: 25

trainer:
  max_epochs: 5000
